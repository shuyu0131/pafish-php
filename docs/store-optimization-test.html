<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用商店优化 - 测试页面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 2rem;
      background: #f5f5f5;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .checklist {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .checklist h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #333;
      border-bottom: 2px solid #4786d6;
      padding-bottom: 0.5rem;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .check-item:hover {
      background: #f8f9fa;
    }
    .check-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #4786d6;
      cursor: pointer;
    }
    .check-item label {
      flex: 1;
      cursor: pointer;
      user-select: none;
    }
    .check-item.checked {
      background: #e8f4fd;
    }
    .progress-bar {
      height: 8px;
      background: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4786d6, #6fa3e8);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: center;
      color: #666;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #4786d6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3a6fb8;
    }
    .btn-secondary {
      background: #6c757d;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
    .action-bar {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .status-badge.complete {
      background: #d4edda;
      color: #155724;
    }
    .status-badge.pending {
      background: #fff3cd;
      color: #856404;
    }
    .visual-demo {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .demo-card {
      border: 2px solid #e9ecef;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
    }
    .demo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .demo-card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .demo-card-body {
      padding: 1rem;
    }
    .demo-card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .demo-card-desc {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 1rem;
    }
    .demo-card-footer {
      display: flex;
      gap: 0.5rem;
    }
    .demo-btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      border: 1px solid #dee2e6;
      background: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 应用商店优化测试</h1>
    <p class="subtitle">
      <span class="status-badge complete">已部署</span>
      完成应用商店的视觉与交互优化 · 2026-09-08
    </p>

    <!-- 进度统计 -->
    <div class="checklist">
      <h2>📊 测试进度</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text">
        已完成 <strong id="completedCount">0</strong> / <strong id="totalCount">0</strong> 项测试
        (<strong id="progressPercent">0</strong>%)
      </div>
    </div>

    <!-- 功能测试 -->
    <div class="checklist">
      <h2>✅ 功能测试</h2>
      <div class="check-item">
        <input type="checkbox" id="test-1">
        <label for="test-1">页面加载：访问 <code>/admin/store</code> 页面正常显示</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-2">
        <label for="test-2">Tab 切换：主题/插件 Tab 切换无闪烁</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-3">
        <label for="test-3">搜索功能：输入关键词可正确筛选应用</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-4">
        <label for="test-4">分类筛选：下拉选择分类可正确筛选</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-5">
        <label for="test-5">卡片悬停：鼠标悬停时卡片上浮 + 图片缩放</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-6">
        <label for="test-6">详情抽屉：点击"查看详情"从右侧滑入</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-7">
        <label for="test-7">抽屉关闭：点击遮罩层或关闭按钮可关闭</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-8">
        <label for="test-8">加载状态：点击"安装"按钮显示旋转动画</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-9">
        <label for="test-9">Toast 通知：安装成功后显示绿色通知</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="test-10">
        <label for="test-10">刷新目录：点击"刷新目录"按钮正常工作</label>
      </div>
    </div>

    <!-- 响应式测试 -->
    <div class="checklist">
      <h2>📱 响应式测试</h2>
      <div class="check-item">
        <input type="checkbox" id="responsive-1">
        <label for="responsive-1">桌面布局：> 768px 时显示 3 列网格</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="responsive-2">
        <label for="responsive-2">平板布局：480-768px 时显示 2 列网格</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="responsive-3">
        <label for="responsive-3">手机布局：< 480px 时显示 1 列网格</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="responsive-4">
        <label for="responsive-4">移动端按钮：按钮全宽显示，易于点击</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="responsive-5">
        <label for="responsive-5">移动端抽屉：抽屉全屏显示，内容完整</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="responsive-6">
        <label for="responsive-6">工具栏适配：搜索框和分类选择器垂直堆叠</label>
      </div>
    </div>

    <!-- 浏览器兼容性 -->
    <div class="checklist">
      <h2>🌐 浏览器兼容性</h2>
      <div class="check-item">
        <input type="checkbox" id="browser-1">
        <label for="browser-1">Chrome 最新版：所有功能正常</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="browser-2">
        <label for="browser-2">Firefox 最新版：所有功能正常</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="browser-3">
        <label for="browser-3">Safari (macOS)：所有功能正常</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="browser-4">
        <label for="browser-4">Edge 最新版：所有功能正常</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="browser-5">
        <label for="browser-5">移动端 Safari (iOS)：所有功能正常</label>
      </div>
      <div class="check-item">
        <input type="checkbox" id="browser-6">
        <label for="browser-6">移动端 Chrome (Android)：所有功能正常</label>
      </div>
    </div>

    <!-- 视觉演示 -->
    <div class="visual-demo">
      <h2 style="margin-bottom: 1rem;">🎨 视觉效果预览</h2>
      <p style="color: #666; margin-bottom: 1.5rem;">
        以下是优化后卡片的视觉效果模拟（悬停查看效果）
      </p>
      <div class="demo-grid">
        <div class="demo-card">
          <div class="demo-card-image">主题 A</div>
          <div class="demo-card-body">
            <div class="demo-card-title">Lumina 主题 v1.0.0</div>
            <div class="demo-card-desc">极简设计的博客主题，适合个人博客</div>
            <div class="demo-card-footer">
              <button class="demo-btn">查看详情</button>
              <button class="demo-btn">安装</button>
            </div>
          </div>
        </div>
        <div class="demo-card">
          <div class="demo-card-image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">主题 B</div>
          <div class="demo-card-body">
            <div class="demo-card-title">Anatole 主题 v2.0.0</div>
            <div class="demo-card-desc">现代风格企业模板，功能丰富</div>
            <div class="demo-card-footer">
              <button class="demo-btn">查看详情</button>
              <button class="demo-btn">已安装</button>
            </div>
          </div>
        </div>
        <div class="demo-card">
          <div class="demo-card-image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">插件 C</div>
          <div class="demo-card-body">
            <div class="demo-card-title">SEO 优化插件 v1.5.0</div>
            <div class="demo-card-desc">自动生成 sitemap 和 meta 标签</div>
            <div class="demo-card-footer">
              <button class="demo-btn">查看详情</button>
              <button class="demo-btn">安装</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <a href="/admin/store" class="btn">🚀 打开应用商店</a>
      <button class="btn btn-secondary" onclick="resetChecklist()">🔄 重置清单</button>
      <button class="btn btn-secondary" onclick="exportResults()">📥 导出结果</button>
    </div>
  </div>

  <script>
    // 统计进度
    function updateProgress() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const total = checkboxes.length;
      const completed = Array.from(checkboxes).filter(cb => cb.checked).length;
      const percent = Math.round((completed / total) * 100);

      document.getElementById('completedCount').textContent = completed;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('progressPercent').textContent = percent;
      document.getElementById('progressFill').style.width = percent + '%';

      // 保存状态
      saveState();
    }

    // 复选框事件
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const item = this.closest('.check-item');
        if (this.checked) {
          item.classList.add('checked');
        } else {
          item.classList.remove('checked');
        }
        updateProgress();
      });
    });

    // 点击整行切换
    document.querySelectorAll('.check-item label').forEach(label => {
      label.addEventListener('click', function(e) {
        if (e.target.tagName !== 'CODE') {
          e.preventDefault();
          const checkbox = this.previousElementSibling;
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event('change'));
        }
      });
    });

    // 保存状态到 localStorage
    function saveState() {
      const state = {};
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        state[cb.id] = cb.checked;
      });
      localStorage.setItem('storeOptTestState', JSON.stringify(state));
    }

    // 恢复状态
    function loadState() {
      const saved = localStorage.getItem('storeOptTestState');
      if (saved) {
        const state = JSON.parse(saved);
        Object.keys(state).forEach(id => {
          const checkbox = document.getElementById(id);
          if (checkbox) {
            checkbox.checked = state[id];
            checkbox.dispatchEvent(new Event('change'));
          }
        });
      }
    }

    // 重置清单
    function resetChecklist() {
      if (confirm('确定要重置所有测试项吗？')) {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = false;
          cb.dispatchEvent(new Event('change'));
        });
        localStorage.removeItem('storeOptTestState');
      }
    }

    // 导出结果
    function exportResults() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const results = Array.from(checkboxes).map(cb => {
        const label = cb.nextElementSibling.textContent;
        return `${cb.checked ? '✅' : '⬜'} ${label}`;
      });

      const text = '# 应用商店优化测试结果\n\n' + results.join('\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'store-optimization-test-results.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    // 初始化
    loadState();
    updateProgress();
  </script>
</body>
</html>
