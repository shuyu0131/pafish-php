<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台视觉检查</title>
<link rel="stylesheet" href="/public/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <button class="admin-icon-btn" aria-label="打开菜单">☰</button>
    <a class="admin-topbar-brand" href="#">纸鱼博客</a>
    <span class="admin-avatar-sm"></span>
  </header>
  <aside class="admin-sidebar">
    <a class="admin-brand" href="#">纸鱼博客</a>
    <nav class="admin-nav">
      <a class="admin-nav-item active" href="#"><span>工作台</span></a>
      <div class="admin-nav-group">
        <button class="admin-nav-group-toggle"><span>内容</span></button>
        <div class="admin-nav-group-items">
          <a class="admin-nav-item" href="#"><span>文章管理</span></a>
          <a class="admin-nav-item" href="#"><span>页面管理</span></a>
          <a class="admin-nav-item" href="#"><span>评论审核</span></a>
        </div>
      </div>
      <div class="admin-nav-group">
        <button class="admin-nav-group-toggle"><span>外观</span></button>
        <div class="admin-nav-group-items">
          <a class="admin-nav-item" href="#"><span>主题与外观</span></a>
          <a class="admin-nav-item" href="#"><span>侧边栏组件</span></a>
        </div>
      </div>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-content">
      <div class="admin-stack admin-posts-page">
        <div class="admin-page-head">
          <div><h1 class="admin-h1">文章管理</h1></div>
          <div class="admin-head-actions">
            <button class="btn btn-outline">导入 Markdown</button>
            <button class="btn btn-primary">写文章</button>
          </div>
        </div>
        <div class="admin-tabs">
          <button class="admin-tab is-active">全部</button>
          <button class="admin-tab">已发布 (18)</button>
          <button class="admin-tab">草稿 (3)</button>
          <button class="admin-tab">回收站 (0)</button>
        </div>
        <div class="admin-filter-bar">
          <div class="admin-filter-group">
            <select class="input admin-filter-select"><option>全部分类</option></select>
            <select class="input admin-filter-select"><option>最新发布</option></select>
            <form class="admin-search"><input class="input" placeholder="搜索标题或内容"><button class="btn btn-outline">搜索</button></form>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th></th><th>标题</th><th>分类</th><th>作者</th><th>评论</th><th>浏览</th><th>更新时间</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td class="admin-col-check"><input type="checkbox" aria-label="选择文章"></td><td data-label="标题"><a class="admin-post-title">欢迎使用纸鱼博客系统</a><div class="admin-post-meta"><span class="badge admin-status badge-success">已发布</span><span>发布 2026-09-10 16:30</span></div></td><td class="admin-col-md" data-label="分类">默认分类</td><td class="admin-col-lg" data-label="作者">管理员</td><td class="admin-col-lg" data-label="评论">0</td><td class="admin-col-sm" data-label="浏览">12</td><td data-label="更新时间"><span class="admin-post-time">2026-09-10 16:30</span></td><td data-label="操作"><div class="admin-row-ops"><button class="admin-icon-btn" title="编辑">编辑</button><button class="admin-icon-btn" title="查看">查看</button></div></td></tr>
              <tr><td class="admin-col-check"><input type="checkbox" aria-label="选择文章"></td><td data-label="标题"><a class="admin-post-title">这是一篇等待完善的草稿文章</a><div class="admin-post-meta"><span class="badge admin-status admin-status-draft">草稿</span></div></td><td class="admin-col-md" data-label="分类">随笔</td><td class="admin-col-lg" data-label="作者">管理员</td><td class="admin-col-lg" data-label="评论">0</td><td class="admin-col-sm" data-label="浏览">0</td><td data-label="更新时间"><span class="admin-post-time">2026-09-09 09:12</span></td><td data-label="操作"><div class="admin-row-ops"><button class="admin-icon-btn" title="编辑">编辑</button></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card admin-form-card">
          <h2 class="admin-card-title">基本设置</h2>
          <div class="admin-form-grid">
            <label class="admin-field"><span class="label">站点名称</span><input class="input" value="纸鱼博客"></label>
            <label class="admin-field"><span class="label">每页文章数</span><input class="input" value="10"></label>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
