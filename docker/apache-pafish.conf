ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # Only the front controller, installer, and scheduled-task endpoint are
    # intended to be executed directly over HTTP. Included PHP files remain
    # available to the application through PHP's filesystem APIs.
    <FilesMatch "(?i)^(?!index\.php$|install\.php$|cron\.php$).+\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(?:\.env(?:\..*)?|composer\.(?:json|lock)|config\.php|config\.example\.php)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "(?i)^(?:Dockerfile|docker-compose(?:\.build)?\.yml|\.dockerignore|\.gitignore|README\.md|DOCKER\.md)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/app">
    Require all denied
</Directory>

<Directory "/var/www/html/docker">
    Require all denied
</Directory>

<Directory "/var/www/html/migrations">
    Require all denied
</Directory>

<Directory "/var/www/html/runtime">
    Require all denied
</Directory>

<Directory "/var/www/html/backups">
    Require all denied
</Directory>

<Directory "/var/www/html/storage">
    Require all denied
</Directory>

<Directory "/var/www/html/vendor">
    Require all denied
</Directory>

<Directory "/var/www/html/plugins">
    <FilesMatch "(?i)\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/themes">
    <FilesMatch "(?i)\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/public/uploads">
    AllowOverride None
    <FilesMatch "(?i)\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
