<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台资源页视觉检查</title>
<link rel="stylesheet" href="/public/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-topbar"><button class="admin-icon-btn" aria-label="打开菜单">☰</button><a class="admin-topbar-brand">纸鱼博客</a></header>
  <aside class="admin-sidebar"><a class="admin-brand">纸鱼博客</a><nav class="admin-nav"><a class="admin-nav-item active">应用商店</a><a class="admin-nav-item">主题与外观</a><a class="admin-nav-item">插件管理</a><a class="admin-nav-item">站点设置</a></nav></aside>
  <main class="admin-main"><div class="admin-content"><div class="admin-stack admin-store-page">
    <div class="admin-page-head"><h1 class="admin-h1">应用商店</h1></div>
    <div class="admin-store-source"><strong class="admin-store-source-label">官方应用商店</strong><span class="badge badge-primary">已绑定开发者账号</span><button class="btn btn-ghost btn-sm" id="storeRefresh">刷新目录</button></div>
    <div class="admin-tabs"><button class="admin-tab is-active">主题（12）</button><button class="admin-tab">插件（8）</button></div>
    <div class="admin-store-toolbar"><input class="input admin-store-search" placeholder="搜索已上架的主题与插件"><select class="input admin-store-cat"><option>全部分类</option></select></div>
    <div class="admin-store-pane"><div class="admin-theme-grid">
      <article class="card admin-theme-card"><div class="admin-store-thumb"></div><div class="admin-theme-head"><p class="admin-theme-name">Lumina <span class="badge">博客主题</span><span class="admin-theme-version">v1.3.0</span></p><p class="admin-theme-desc">轻量、清晰的个人博客主题，支持响应式布局和主题设置。</p><p class="admin-muted admin-theme-meta">作者：纸鱼</p></div><div class="admin-theme-ops"><button class="btn btn-ghost btn-sm">查看详情</button><button class="btn btn-primary btn-sm">安装</button></div></article>
      <article class="card admin-theme-card"><div class="admin-store-thumb"></div><div class="admin-theme-head"><p class="admin-theme-name">简约相册 <span class="badge">相册</span><span class="admin-theme-version">v1.1.2</span></p><p class="admin-theme-desc">适合摄影和图片内容展示的简约主题。</p><p class="admin-muted admin-theme-meta">作者：Pafish Studio</p></div><div class="admin-theme-ops"><button class="btn btn-ghost btn-sm">查看详情</button><button class="btn btn-primary btn-sm">更新</button></div></article>
    </div></div>
    <section class="admin-stack admin-extension-page admin-theme-page">
      <div class="admin-page-head"><h1 class="admin-h1">主题与外观</h1></div>
      <div class="card admin-resource-list"><div class="card-body"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>主题</th><th class="admin-col-md">状态</th><th class="admin-col-md">作者</th><th class="admin-col-sm">版本</th><th class="admin-col-ops">操作</th></tr></thead><tbody><tr><td><div class="admin-plugin-title"><a class="admin-plugin-name">Lumina</a></div><div class="admin-plugin-meta">轻量个人博客主题</div><div class="admin-plugin-info"><span>目录：themes/lumina/</span><span>设置项：24</span></div></td><td class="admin-col-md" data-label="状态"><span class="badge badge-primary">当前主题</span></td><td class="admin-col-md" data-label="作者">纸鱼</td><td class="admin-col-sm" data-label="版本">v1.3.0</td><td class="admin-col-ops" data-label="操作"><div class="admin-row-ops"><button class="btn btn-primary btn-sm">设置</button></div></td></tr></tbody></table></div></div></div>
    </section>
    <section class="admin-stack admin-settings-page"><div class="admin-page-head"><h1 class="admin-h1">站点设置</h1></div><div class="card admin-form-card"><h2 class="admin-card-title">基本设置</h2><div class="admin-form-grid"><label class="admin-field"><span class="label">站点名称</span><input class="input" value="纸鱼博客"></label><label class="admin-field"><span class="label">站点地址</span><input class="input" value="https://example.com"></label></div></div></section>
  </div></div></main>
</body>
</html>
